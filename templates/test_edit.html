{% extends 'base.html' %}
{% block title %}Edit Test{% endblock %}
{% block topbar_title %}<a href="{{ url_for('test_detail', test_id=test.id) }}" class="breadcrumb">{{ test.name }}</a> / Edit{% endblock %}

{% block content %}
<div class="form-panel">
  <form method="post">
    <div class="form-section">
      <div class="form-group">
        <label>Test Name</label>
        <input type="text" name="name" value="{{ test.name }}" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Test Type</label>
          <select name="test_type">
            <option value="progression_blend" {% if test.test_type == 'progression_blend' %}selected{% endif %}>Progression Blend</option>
            <option value="discrete_batch" {% if test.test_type == 'discrete_batch' %}selected{% endif %}>Discrete Batch</option>
          </select>
        </div>
        <div class="form-group">
          <label>Base Batch Size (g)</label>
          <input type="number" name="base_batch_size" value="{{ test.base_batch_size or 100 }}" step="0.1">
        </div>
      </div>
      <div class="form-group">
        <label>Variable</label>
        <input type="text" name="variable" value="{{ test.variable or '' }}" placeholder="e.g. Colorant">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="4" placeholder="Goal, variables, what to look for…">{{ test.description or '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('test_detail', test_id=test.id) }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
